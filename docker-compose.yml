version: "3.9"

services:
  backend:
    build:
      context: ./backend_files
      dockerfile: Dockerfile
    container_name: superkart_backend
    ports:
      - "7860:7860"
    networks:
      - superkart-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend_files
      dockerfile: Dockerfile
    container_name: superkart_frontend
    ports:
      - "8501:8501"
    networks:
      - superkart-net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  superkart-net:
    driver: bridge
